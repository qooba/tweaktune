[build-system]
requires = ["maturin>=0.13"]
build-backend = "maturin"

[project]
name = "tweaktune"
version = "0.0.1-alpha.12"
requires-python = ">=3.8"
description = "A Python package for syntesize datasets for training and fine-tuning AI models."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
	"pydantic ~=2.10.6",
]

[project.urls]
repository = "https://github.com/qooba/tweaktune"

[tool.setuptools.package-data]
tweaktune = ["templates/*.j2", "templates/**/*.j2"]

[project.scripts]
tweaktune = "tweaktune.cli:main"

[project.optional-dependencies]
cli = [
    "click ~=8.1.0",
    "rich ~=13.0.0",
    "questionary ~=2.0.0",
]
ui = [
    "nicegui ~=1.0.0",
]
dev = [
    "pytest ~=8.3.5",
    "pytest-cov ~=6.1.1",
    "black ~=25.1.0",
    "isort ~=6.0.1",
    "mypy ~=1.5.0",
    "flake8 ~=7.2.0",
    "ruff ~=0.11.8",
    "pydocstyle ~=6.3.0",
    "polars ~=1.29.0",
]
all = [
    "tweaktune[cli,ui,dev,db,arrow,sql]",
]
db = [ "connectorx ~=0.4.3" ]
arrow = [
    "datasets ~=3.2.0", 
    "pyarrow ~=20.0.0"
]
unsloth = [
    "unsloth ~=2025.1.8",
]
sql = [
    "psycopg2-binary ~=2.9.7", 
    "pymysql ~=1.1.0", 
    "sqlmodel ~=0.0.27",
]
toon = [
    "toon-python ~=0.1.2"
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
warn_no_return = false
strict_optional = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tweaktune.ui.*"
ignore_errors = true
